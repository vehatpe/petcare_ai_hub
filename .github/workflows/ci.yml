name: CI

on:
  push:
    branches: ['main', 'master', 'giai-doan-*']
  pull_request:
    branches: ['main', 'master']

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'YourStrong@Password123'
          MSSQL_PID: 'Express'
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Password123' -C -Q 'SELECT 1' || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 15s

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run database migration
        working-directory: backend
        env:
          DB_SERVER: localhost
          DB_NAME: PetCareAIHub
          DB_USER: sa
          DB_PASSWORD: 'YourStrong@Password123'
          DB_PORT: 1433
          DB_ENCRYPT: 'false'
          DB_TRUST_SERVER_CERT: 'true'
        run: node scripts/migrate.js --seed --pool-only

      - name: Run smoke tests on SQL Server
        working-directory: backend
        env:
          DB_SERVER: localhost
          DB_NAME: PetCareAIHub
          DB_USER: sa
          DB_PASSWORD: 'YourStrong@Password123'
          DB_PORT: 1433
          DB_ENCRYPT: 'false'
          DB_TRUST_SERVER_CERT: 'true'
          JWT_SECRET: 'ci-testing-jwt-secret-at-least-32-chars-long!!' # chỉ để test
        run: node scripts/smoke.js

      - name: Run roles lifecycle smoke tests on SQL Server
        working-directory: backend
        env:
          DB_SERVER: localhost
          DB_NAME: PetCareAIHub
          DB_USER: sa
          DB_PASSWORD: 'YourStrong@Password123'
          DB_PORT: 1433
          DB_ENCRYPT: 'false'
          DB_TRUST_SERVER_CERT: 'true'
          JWT_SECRET: 'ci-testing-jwt-secret-at-least-32-chars-long!!' # chỉ để test
        run: node scripts/smoke-roles.js

      - name: Run services management smoke tests on SQL Server
        working-directory: backend
        env:
          DB_SERVER: localhost
          DB_NAME: PetCareAIHub
          DB_USER: sa
          DB_PASSWORD: 'YourStrong@Password123'
          DB_PORT: 1433
          DB_ENCRYPT: 'false'
          DB_TRUST_SERVER_CERT: 'true'
          JWT_SECRET: 'ci-testing-jwt-secret-at-least-32-chars-long!!' # chỉ để test
        run: node scripts/smoke-catalog.js

      - name: Run bookings smoke tests against SQL Server 2022
        working-directory: backend
        env:
          DB_SERVER: localhost
          DB_NAME: PetCareAIHub
          DB_USER: sa
          DB_PASSWORD: 'YourStrong@Password123'
          DB_PORT: 1433
          DB_ENCRYPT: 'false'
          DB_TRUST_SERVER_CERT: 'true'
          JWT_SECRET: 'ci-testing-jwt-secret-at-least-32-chars-long!!' # chỉ để test
        run: node scripts/smoke-bookings.js

      - name: Run uploads smoke tests against SQL Server 2022
        working-directory: backend
        env:
          DB_SERVER: localhost
          DB_NAME: PetCareAIHub
          DB_USER: sa
          DB_PASSWORD: 'YourStrong@Password123'
          DB_PORT: 1433
          DB_ENCRYPT: 'false'
          DB_TRUST_SERVER_CERT: 'true'
          JWT_SECRET: 'ci-testing-jwt-secret-at-least-32-chars-long!!' # chỉ để test
          STORAGE_DRIVER: local
        run: node scripts/smoke-uploads.js
      - name: Smoke test migrate-photos (SQL Server)
        working-directory: backend
        env:
          DB_NAME: PetCareAIHub
          DB_USER: sa
          DB_PASSWORD: 'YourStrong@Password123'
          DB_PORT: 1433
          DB_ENCRYPT: 'false'
          DB_TRUST_SERVER_CERT: 'true'
          JWT_SECRET: 'ci-testing-jwt-secret-at-least-32-chars-long!!' # chỉ để test
          STORAGE_DRIVER: local
        run: node scripts/smoke-migrate-photos.js

      - name: Run tests
        working-directory: backend
        run: npm test
