<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="../js/components/motion-boot.js"></script>
  <title>Bảng điều khiển - PetCare AI Hub</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/pages.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <script src="../js/components/motion.js" defer></script>
</head>
<body data-page-auth="customer">

  <header class="site-header">
    <div class="container header-inner">
      <a href="../index.html" class="brand-logo">
        <div class="logo-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M12 2a4 4 0 0 0-4 4c0 1.6 1 3 2.5 3.7A5 5 0 0 0 6 14v1a5 5 0 0 0 5 5h2a5 5 0 0 0 5-5v-1a5 5 0 0 0-4.5-4.3C15 9 16 7.6 16 6a4 4 0 0 0-4-4Z"></path></svg>
        </div>
        <span>PetCare AI Hub</span>
      </a>
      <nav class="main-nav" aria-label="Điều hướng chính">
        <a href="../index.html" class="nav-link">Trang chủ</a>
        <a href="services.html" class="nav-link">Dịch vụ Thú cưng</a>
        <a href="providers.html" class="nav-link">Cơ sở & Phòng khám</a>
        <a href="booking.html" class="nav-link">Đặt lịch hẹn</a>
        <a href="ai-assistant.html" class="nav-link">Trợ lý AI</a>
      </nav>
      <div class="header-actions">
        <div class="header-account" data-auth-slot="header"></div>
        <button type="button" class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Mở menu">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
      </div>
    </div>
  </header>

  <main>
    <section class="page-header-banner">
      <div class="container">
        <h1 class="page-title" id="greeting">Bảng điều khiển</h1>
        <p class="page-subtitle">Quản lý hồ sơ thú cưng và lịch hẹn của bạn.</p>
      </div>
    </section>

    <div class="container">
      <section class="today-strip" id="todayStrip" aria-label="Tóm tắt hôm nay"></section>

      <div class="dash-grid">
        <section class="dash-section" aria-labelledby="petsHeading">
          <div class="dash-section-head">
            <h2 id="petsHeading">Thú cưng của bạn</h2>
            <a href="pet-profile.html" class="btn btn-primary btn-sm" id="addPetBtn" hidden>Thêm thú cưng</a>
          </div>
          <div id="petList"></div>
        </section>

        <section class="dash-section" aria-labelledby="bookingsHeading">
          <div class="dash-section-head">
            <h2 id="bookingsHeading">Lịch hẹn</h2>
            <a href="booking.html" class="btn btn-outline btn-sm" id="newBookingBtn" hidden>Đặt lịch mới</a>
          </div>
          <div id="bookingList"></div>
        </section>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <div>&copy; 2026 PetCare AI Hub. All rights reserved.</div>
      </div>
    </div>
  </footer>

  <script src="../js/utils/format.js"></script>
  <script src="../js/components/toast.js"></script>
  <script src="../js/components/panel.js"></script>
  <script src="../js/components/dialog.js"></script>
  <script src="../js/config/api.config.js"></script>
  <script src="../js/services/auth.service.js"></script>
  <script src="../js/services/pet.service.js"></script>
  <script src="../js/services/catalog.service.js"></script>
  <script src="../js/services/booking.service.js"></script>
  <script src="../js/services/dashboard.service.js"></script>
  <script src="../js/components/auth-gate.js"></script>
  <script src="../js/components/header.js"></script>
  <script src="../js/pages/dashboard-customer.js"></script>
</body>
</html>
