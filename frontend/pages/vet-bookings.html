<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="../js/components/motion-boot.js"></script>
  <title>Lịch khám của tôi - PetCare AI Hub</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/pages.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <script src="../js/components/motion.js" defer></script>
</head>
<body data-page-auth="vet">

  <header class="site-header">
    <div class="container header-inner">
      <a href="../index.html" class="brand-logo">
        <div class="logo-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M12 2a4 4 0 0 0-4 4c0 1.6 1 3 2.5 3.7A5 5 0 0 0 6 14v1a5 5 0 0 0 5 5h2a5 5 0 0 0 5-5v-1a5 5 0 0 0-4.5-4.3C15 9 16 7.6 16 6a4 4 0 0 0-4-4Z"></path></svg>
        </div>
        <span>PetCare AI Hub</span>
      </a>
      <nav class="main-nav" aria-label="Điều hướng chính">
        <a href="../index.html" class="nav-link">Trang chủ</a>
        <a href="vet-bookings.html" class="nav-link active" aria-current="page">Lịch khám của tôi</a>
      </nav>
      <div class="header-actions">
        <div class="header-account" data-auth-slot="header"></div>
        <button type="button" class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Mở menu">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="container page-shell">
    <div class="page-head">
      <div>
        <span class="eyebrow">Bác sĩ thú y</span>
        <h1>Lịch khám của tôi</h1>
        <p class="text-muted">Danh sách lịch hẹn được phân công cho bạn.</p>
      </div>
      <div class="page-head-actions">
        <button type="button" class="btn btn-outline btn-sm" id="quickTodayBtn" data-action="filter-today">Hôm nay</button>
        <button type="button" class="btn btn-ghost btn-sm" id="quickAllBtn" data-action="filter-all">Tất cả</button>
      </div>
    </div>

    <section class="panel" aria-label="Bộ lọc lịch khám">
      <div class="panel-body">
        <form id="vetFilterForm" class="filter-bar">
          <div class="form-group">
            <label for="statusFilter">Trạng thái</label>
            <select id="statusFilter" class="form-control">
              <option value="">Tất cả trạng thái</option>
              <option value="pending">Chờ xác nhận</option>
              <option value="confirmed">Đã xác nhận</option>
              <option value="completed">Đã hoàn tất</option>
              <option value="cancelled">Đã hủy</option>
              <option value="no_show">Vắng mặt</option>
            </select>
          </div>
          <div class="form-group">
            <label for="fromDateFilter">Từ ngày</label>
            <input type="date" id="fromDateFilter" class="form-control">
          </div>
          <div class="form-group">
            <label for="toDateFilter">Đến ngày</label>
            <input type="date" id="toDateFilter" class="form-control">
          </div>
          <div class="form-group">
            <label for="searchFilter">Tìm kiếm</label>
            <input type="search" id="searchFilter" class="form-control" placeholder="Tên thú cưng, dịch vụ, chủ nuôi…">
          </div>
          <div class="form-group filter-actions">
            <button type="submit" class="btn btn-primary btn-sm">Lọc</button>
          </div>
        </form>
      </div>
    </section>

    <section class="panel" aria-label="Danh sách lịch khám">
      <div class="panel-body" id="vetBookingsList"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p class="footer-copy">© PetCare AI Hub</p>
      <ul class="footer-links" data-auth-slot="footer-account"></ul>
    </div>
  </footer>

  <script src="../js/utils/format.js"></script>
  <script src="../js/components/toast.js"></script>
  <script src="../js/components/dialog.js"></script>
  <script src="../js/components/panel.js"></script>
  <script src="../js/config/api.config.js"></script>
  <script src="../js/services/auth.service.js"></script>
  <script src="../js/services/booking.service.js"></script>
  <script src="../js/components/auth-gate.js"></script>
  <script src="../js/components/header.js"></script>
  <script src="../js/pages/vet-bookings.js"></script>
</body>
</html>
